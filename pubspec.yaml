name: scanly
description: "A free, offline-first document scanner with Bangla-English OCR."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # State management and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  google_mlkit_document_scanner: ^0.7.2
  image_picker: ^1.2.4
  camera: ^0.12.2
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  camera_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
